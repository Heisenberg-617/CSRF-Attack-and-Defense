{# Edit task page #}
<!DOCTYPE html>
<html>
<head>
    <title>Edit Task</title>
</head>
<body>

    <h1>Edit Task</h1>

    <form method="POST">

        <label>Title</label>
        <br>

        <input
            type="text"
            name="title"
            value="{{ task.title }}"
            required
        >

        <br><br>

        <label>Description</label>
        <br>

        <textarea name="description">{{ task.description }}</textarea>

        <br><br>

        <label>Deadline</label>
        <br>

        <input
            type="date"
            name="deadline"
            value="{{ task.deadline }}"
        >

        <br><br>

        <label>Team</label>
        <br>

        <select name="team_id">

            {% for team in teams %}

                <option
                    value="{{ team.id }}"
                    {% if task.team_id == team.id %}
                        selected
                    {% endif %}
                >
                    {{ team.name }}
                </option>

            {% endfor %}

        </select>

        <br><br>

        <button type="submit">
            Update Task
        </button>

    </form>

    <br>

    <a href="{{ url_for('tasks.dashboard') }}">
        Back to Dashboard
    </a>

</body>
</html>
